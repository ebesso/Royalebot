[project]
name = "royalebot"
version = "0.1.0"
description = "A bot that plays Clash Royale from screen frames."
requires-python = ">=3.12"
dependencies = [
    "rich>=13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["royalebot*"]
